name: Feature request
description: Suggest an improvement to YT Ad Skip.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include alternatives you have considered and any compatibility concerns.
    validations:
      required: true
